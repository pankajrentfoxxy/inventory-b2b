global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Services expose /metrics on the internal network (phase-00 step 5). Add one job per service as
# it appears; the gateway and legacy API are reached through the Docker host in local development.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4010']
  - job_name: legacy-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4000']

# DLQ depth > 0 must page (README 5.8). RabbitMQ's prometheus plugin exposes per-queue metrics
# when detailed metrics are enabled; this rule reads them.
rule_files:
  - /etc/prometheus/alerts.yml
