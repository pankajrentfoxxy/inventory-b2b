# Optional dedicated PostgreSQL for this project. Local dev in the Rentfoxxy team
# currently reuses the shared `laptop-erp-postgres` container on port 5433 (see .env.example).
name: b2b-inventory
services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-inventory-postgres
    environment:
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b_dev
      POSTGRES_DB: b2b_inventory
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5434:5432'
    volumes:
      - b2b-inventory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b2b -d b2b_inventory']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  b2b-inventory-pgdata:
